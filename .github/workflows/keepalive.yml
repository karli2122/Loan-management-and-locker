name: Keep API Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          echo "Pinging API..."
          curl -sf "https://paylock-fixes.preview.emergentagent.com/api/health" && echo "OK" || echo "API unreachable"
